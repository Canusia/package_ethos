[metadata]
name = ethos
version = 2026.1.2
description = Ellucian Ethos SIS integration client for MyCE
author = Canusia

[options]
packages = find:
include_package_data = True
install_requires =
    Django>=3.2
    requests>=2.31
    PyJWT>=2.0

[options.extras_require]
cli =
    python-dotenv>=1.0

[options.entry_points]
console_scripts =
    ethos-sis = ethos_sis.cli:main

[options.packages.find]
exclude =
    tests*
    ethos_sis.tests*

[options.package_data]
ethos =
    templates/**/*
    staticfiles/**/*
